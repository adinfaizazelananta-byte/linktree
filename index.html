<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Linktree Siswa</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', Arial, sans-serif;
        }

        body {
            background-color: pink;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid pink;
            margin-bottom: 15px;
        }

        .nama {
            font-size: 18px;
            font-weight: 600;
            color: pink;
            margin-bottom: 3px;
        }

        .kelas {
            font-size: 14px;
            font-weight: 600;
            color: black;
            margin-bottom: 15px;
        }

        .bio {
            font-size: 13px;
            color: #555555;
            line-height: 1.5;
            margin-bottom: 25px;
            padding: 0 10px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-link {
            display: block;
            padding: 12px 20px;
            background-color: pink;
            color: #ffffff;
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.3s ease;   
            box-shadow: 0 4px 6px rgba(76, 175, 80, 0.2);
        }

        .btn-link:hover {
            background-color: pink;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(76, 175, 80, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://i.pinimg.com/736x/58/c1/fc/58c1fcf06c1fb344251f8f62ebe0a825.jpg" alt="Foto Profil" class="profile-img">
        <div class="nama">Adin Faiza Zelananta</div>
        <div class="kelas">XI TJKT 2</div>
        <p class="bio">
            Halo!
        </p>
        <div class="links-container">
            <a href="https://www.instagram.com/d.d1zzael_?stkn=Y2loZGE3ZXo5M3Zw" target="_blank" class="btn-link">Instagram</a>
            <a href="https://www.tiktok.com/@dimsyumg0yeng_?is_from_webapp=1&sender_device=pc" target="_blank" class="btn-link">TikTok</a>
            <a href="https://whatsapp.com/channel/0029Vb6p2bs2ZjCigxTO293b" target="_blank" class="btn-link">Saluran</a>
            <a href="https://github.com/adinfaizazelananta-byte" target="_blank" class="btn-link">Github</a>
        </div>
    </div>

</body>
</html>
